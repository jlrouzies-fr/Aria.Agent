name: PR Build

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/AriaAgent/**'
      - '.github/workflows/pr-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore src/AriaAgent/Aria.Web/Aria.Web.csproj
          dotnet restore src/AriaAgent/Aria.Bridge/Aria.Bridge.csproj

      - name: Build Aria.Web
        run: dotnet build src/AriaAgent/Aria.Web/Aria.Web.csproj --no-restore --configuration Release

      - name: Build Aria.Bridge
        run: dotnet build src/AriaAgent/Aria.Bridge/Aria.Bridge.csproj --no-restore --configuration Release

      # Aria.Tests and Aria.Console pin <RuntimeIdentifier>osx-arm64</RuntimeIdentifier> as a local dev
      # default, so the RID is overridden here the same way release-bridge.yml does with -r. Restore is
      # not shared with the steps above because those resolve RID-agnostic assets.
      #
      # Debug (not Release): /api/debug/* endpoints are #if DEBUG-only
      # (Aria.Web/Endpoints/DebugEndpoints.cs). IntegrationTests hit those routes; Release omits them
      # and the suite fails with 404/400. Web/Bridge Release builds above still gate shipping config.
      - name: Test
        run: >
          dotnet test src/AriaAgent/Aria.Tests/Aria.Tests.csproj
          --configuration Debug
          -p:RuntimeIdentifier=linux-x64
          --logger "console;verbosity=normal"
